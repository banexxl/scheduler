<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="slotGradPurple2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square with calendar/slot motif -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="160" height="160" rx="36" fill="url(#slotGradPurple2)"/>

    <!-- calendar top tabs -->
    <rect x="40" y="22" width="14" height="26" rx="7" fill="#FFFFFF"/>
    <rect x="106" y="22" width="14" height="26" rx="7" fill="#FFFFFF"/>

    <!-- calendar body -->
    <rect x="28" y="40" width="104" height="96" rx="16" fill="#FFFFFF"/>

    <!-- open slot (highlighted cell) -->
    <rect x="46" y="86" width="68" height="30" rx="8" fill="url(#slotGradPurple2)"/>
    <!-- checkmark inside slot -->
    <path d="M62 101 L73 111 L98 89" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- small dots representing other slots -->
    <circle cx="46" cy="128" r="5" fill="#CBD5E1"/>
    <circle cx="66" cy="128" r="5" fill="#CBD5E1"/>
    <circle cx="86" cy="128" r="5" fill="#CBD5E1"/>
    <circle cx="106" cy="128" r="5" fill="#CBD5E1"/>
  </g>

  <!-- Wordmark: original style, kept as-is except color -->
  <text x="210" y="118" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#1E293B">Get<tspan fill="#8B5CF6">Slot</tspan></text>

  <!-- Tagline -->
  <text x="212" y="150" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#64748B" letter-spacing="1">SCHEDULE ANYTHING, ANYTIME</text>
</svg>
