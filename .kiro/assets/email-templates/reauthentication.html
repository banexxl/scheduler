<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Identity</title>
</head>
<body style="margin:0;padding:0;background-color:#0a0a0f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0a0f;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <img src="{{ .SiteURL }}/logos/getslot_icon.svg" alt="GetSlot" width="56" height="56" style="display:block;">
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color:#16161e;border:1px solid rgba(124,58,237,0.15);border-radius:16px;padding:40px 32px;text-align:center;">

              <div style="width:60px;height:3px;background:linear-gradient(90deg,#7C3AED,#a855f7);border-radius:2px;margin:0 auto 24px;"></div>

              <!-- Shield icon -->
              <div style="font-size:36px;margin-bottom:16px;">🛡️</div>

              <h1 style="margin:0 0 8px;font-size:22px;font-weight:700;color:#f0f0f5;line-height:1.3;">
                Verify your identity
              </h1>
              <p style="margin:0 0 28px;font-size:15px;color:#8b8b9e;line-height:1.6;">
                A sensitive action was requested on your account. Enter the code below to verify your identity.
              </p>

              <!-- OTP Code -->
              <div style="margin:0 auto 24px;display:inline-block;background-color:#0a0a0f;border:1px solid rgba(124,58,237,0.25);border-radius:12px;padding:16px 32px;">
                <span style="font-size:32px;font-weight:800;letter-spacing:8px;color:#a78bfa;font-family:monospace;">{{ .Token }}</span>
              </div>

              <p style="margin:0 0 0;font-size:13px;color:#5c5c72;line-height:1.5;">
                This code expires in 5 minutes.
              </p>

              <!-- Warning -->
              <div style="margin:20px auto 0;max-width:360px;background-color:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.15);border-radius:8px;padding:12px 16px;">
                <p style="margin:0;font-size:12px;color:#EF4444;line-height:1.5;">
                  If you didn't initiate this action, please change your password immediately.
                </p>
              </div>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding-top:24px;">
              <p style="margin:0;font-size:11px;color:#3a3a4a;">
                &copy; {{ .SiteURL }} &middot; GetSlot
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
